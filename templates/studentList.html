<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>List Students from table</h1>
	<a href="/student/add">
		<button type="button">新增學生</button>
	</a>
	<br><br>
	<table>
	<tr>
		<td>流水號</td>
		<td>學號</td>
		<td>姓名</td>
		<td>刪除</td>
	</tr>
	{% for p in students %}
	<tr>
		<td>{{ loop.index }}: <a href="/student/edit/{{p.stuid }}">Edit</a></td>
		<td>{{ p.stuid }} </td>
		<td>{{ p.name }}</td>
		<td>
			<form method="post" action="/student/delete"
					onsubmit="return confirm('確定要刪除這位學生嗎？');">
				<input type="hidden" name="stuid"
						value="{{ p.stuid }}">
				<button type="submit" title="刪除學生"
						style="border:none; background:none; cursor:pointer;">
					🗑️
				</button>
			</form>
		</td>
	</tr>
	{% endfor %}
	</table>
</body>
</html>
